# Construit PC-City.exe sous Windows et l'attache à la release GitHub.
# Déclenchement : pousser un tag « v… » (ex. git tag v3.0 && git push origin v3.0),
# ou créer une release depuis GitHub avec un nouveau tag « v… » (ça pousse le tag),
# ou lancer le workflow à la main (onglet Actions : l'exe est alors dans les artefacts).
name: Release .exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dépendances
        run: python -m pip install --upgrade pip pyinstaller psutil==7.2.2

      - name: Construction de PC-City.exe
        run: >
          pyinstaller serveur.py --onefile --noconsole --name PC-City
          --icon ville/icone.ico
          --add-data "ville;ville"
          --add-data "config.json;."
          --hidden-import icones --hidden-import collecteur --hidden-import historique
          --hidden-import registre --hidden-import cache_dns

      - name: Garder l'exe dans les artefacts du workflow
        uses: actions/upload-artifact@v4
        with:
          name: PC-City-exe
          path: dist/PC-City.exe

      - name: Attacher l'exe à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PC-City.exe
